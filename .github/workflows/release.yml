name: Release NovaFiles Alpha

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run All Automated Unit Tests
        run: ./gradlew test

      - name: Configure Release Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > novafiles-release.jks
            echo "KEYSTORE_PATH=novafiles-release.jks" >> local.properties
            echo "STORE_PASSWORD=$STORE_PASSWORD" >> local.properties
            echo "KEY_ALIAS=$KEY_ALIAS" >> local.properties
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> local.properties
          elif [ -f "novafiles-release.jks" ]; then
            echo "Using existing repository keystore configuration."
          fi

      - name: Assemble Release APK
        run: ./gradlew assembleRelease

      - name: Verify Release APK Output
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Release APK not found at $APK_PATH"
            exit 1
          fi
          echo "Release APK verified successfully."
          mkdir -p release-artifacts
          cp "$APK_PATH" "release-artifacts/NovaFiles-1.0.0-alpha1.apk"
          sha256sum "release-artifacts/NovaFiles-1.0.0-alpha1.apk" > "release-artifacts/checksums-v1.0.0-alpha1.txt"
          cat "release-artifacts/checksums-v1.0.0-alpha1.txt"

      - name: Extract Release Notes from CHANGELOG.md
        id: changelog
        run: |
          sed -n '/## \[1.0.0-alpha1\]/,/## \[/p' CHANGELOG.md | sed '$d' > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NovaFiles 1.0.0-alpha1 — First Public Alpha
          body_path: RELEASE_NOTES.md
          prerelease: true
          draft: false
          files: |
            release-artifacts/NovaFiles-1.0.0-alpha1.apk
            release-artifacts/checksums-v1.0.0-alpha1.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
